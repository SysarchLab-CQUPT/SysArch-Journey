color:#edf5fc;border-radius:5px;padding:3px 10px;font-size:12px}ul,ol{padding-left:1.65em}li{padding:3px 0}math{font-size:1.04em}math[display="block"]{overflow-x:auto;display:block;padding:14px 0}.csl-bib-body{font-size:14px;line-height:1.8}.csl-entry{margin:15px 0;overflow-wrap:anywhere}
#explorer{margin:35px 0;background:white;padding:28px;border:1px solid var(--line);border-radius:12px}#explorer h2{font-size:25px;margin:0 0 16px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.controls button{border:0;border-radius:7px;background:var(--blue);color:white;padding:7px 13px;font-size:14px}.controls input{flex:1;min-width:140px}.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin:22px 0}.stage{background:#f1f5fb;border-top:4px solid var(--blue);padding:13px;border-radius:6px;min-height:122px}.stage b{display:block;font-size:21px}.stage span{font:13px/1.8 Consolas,monospace;overflow-wrap:anywhere}.bubble{border-color:#9babbc;color:#586c82}.status{padding:16px;background:#eaf5f0;border-left:4px solid var(--green);font-size:15px;min-height:90px}.note{font-size:13px;color:var(--muted)}details summary{padding:10px 0;font-size:15px;font-weight:650}footer{font-size:13px;color:var(--muted);padding:28px 0}dialog{max-width:96vw;width:1400px;border:1px solid var(--line);border-radius:12px;padding:16px;background:white;color:var(--ink)}dialog::backdrop{background:#102439bb}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:0 0 12px;font-size:14px}.dialog-head button{border:1px solid var(--line);border-radius:6px;background:#eef3fa;padding:5px 16px}.image-frame{overflow:auto;max-height:80vh}.image-frame img{width:max(100%,1150px);max-width:none;display:block}

@media print{header,aside,.mobile-toc,.copy,.controls{display:none}.layout{display:block;padding:0}.textbook{padding:0;border:0}body{background:white;font-size:11pt}figure,pre,table{break-inside:avoid}pre{white-space:pre-wrap;color:#16324f;background:#f4f6f8}.textbook h2{break-before:page}a{color:inherit}}

<div class="hero"><div class="eyebrow">CHAPTER 04 · 从结构图到 RTL</div><h1>让五级流水线<br>从图纸走进代码</h1><p>读懂每一根连线、每一组流水寄存器和每一次暂停。沿着同一段指令，串起电路结构、Verilog 实现与实际仿真波形。</p><div class="chips"><span>4.04 / 4.05 完整教材</span><span>6 张可放大矢量图</span><span>8 组仿真通过</span><span>无需 FPGA 即可复现</span></div></div>

<!-- TEXTBOOK -->
</article>
<!-- EXPLORER -->
<footer>配套 <a href="https://github.com/SysarchLab-CQUPT/SysArch-Journey/issues/6">Issue #6</a> · 正文与 PDF 共用 LaTeX 源文件；代码摘录来自实际仿真的 RTL。点击结构图可放大，代码右上角可复制。</footer>

</div>
<dialog id="image-dialog" aria-label="放大查看结构图"><div class="dialog-head"><span id="image-caption">结构图</span><button id="close-image">关闭</button></div><div class="image-frame"><img id="large-image" alt=""></div></dialog>
<script>
/* EXPLORER_SCRIPT */
const headings=[...document.querySelectorAll('#textbook h2,#textbook h3')];
const tocHTML=headings.map((h,i)=>{if(!h.id)h.id='reading-'+i;return `<a class="${h.tagName==='H3'?'sub':''}" href="#${h.id}">${h.textContent}</a>`}).join('')+'<a href="#explorer">逐拍交互演示</a>';
document.getElementById('desktop-toc').innerHTML=tocHTML;document.getElementById('mobile-toc').innerHTML=tocHTML;
document.querySelectorAll('#mobile-toc a').forEach(a=>a.addEventListener('click',()=>document.querySelector('.mobile-toc').open=false));
const readingObserver=new IntersectionObserver(entries=>{for(const e of entries){if(e.isIntersecting){document.querySelectorAll('.toc a').forEach(a=>a.classList.toggle('active',decodeURIComponent(a.hash)==='#'+e.target.id));}}},{rootMargin:'-80px 0px -65% 0px'});headings.forEach(h=>readingObserver.observe(h));
document.querySelectorAll('pre:not(#signals)').forEach(pre=>{const text=pre.querySelector('code')?.innerText||pre.textContent;const button=document.createElement('button');button.className='copy';button.textContent='复制代码';button.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(text);button.textContent='已复制';}catch{button.textContent='请选中代码复制';}setTimeout(()=>button.textContent='复制代码',1800)});pre.append(button)});
const imageDialog=document.getElementById('image-dialog');document.querySelectorAll('#textbook figure img').forEach(img=>{if(!img.alt)img.alt=img.closest('figure').querySelector('figcaption')?.textContent||'结构图';img.tabIndex=0;img.setAttribute('role','button');img.setAttribute('aria-label','放大：'+img.alt);const open=()=>{document.getElementById('large-image').src=img.src;document.getElementById('large-image').alt=img.alt;document.getElementById('image-caption').textContent=img.closest('figure').querySelector('figcaption')?.textContent||'结构图';imageDialog.showModal()};img.addEventListener('click',open);img.addEventListener('keydown',e=>{if(e.key==='Enter')open()})});document.getElementById('close-image').onclick=()=>imageDialog.close();imageDialog.addEventListener('click',e=>{if(e.target===imageDialog)imageDialog.close()});
document.getElementById('font-size').onclick=()=>{const large=document.documentElement.dataset.large!=='1';document.documentElement.dataset.large=large?'1':'0';document.documentElement.style.setProperty('--body',large?'20px':'18px');document.getElementById('font-size').textContent=large?'A−':'A+'};
const updateProgress=()=>{const distance=document.documentElement.scrollHeight-innerHeight;document.getElementById('reading-progress').style.width=(distance>0?scrollY/distance*100:0)+'%'};addEventListener('scroll',updateProgress,{passive:true});updateProgress();
</script>
