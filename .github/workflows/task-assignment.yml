name: Task Assignment

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: task-assignment
  cancel-in-progress: false

jobs:
  handle-command:
    name: Handle assignment command
    if: github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - name: Process command
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const rawCommand = context.payload.comment.body.trim();
            const commandMatch = rawCommand.match(/^\/(assign|confirm)(?:\s+(.+))?$/i);
            if (!commandMatch || issue.pull_request) {
              return;
            }
            const command = `/${commandMatch[1].toLowerCase()}`;
            const argument = (commandMatch[2] || '').trim();

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = issue.number;
            const actor = context.payload.comment.user.login;
            const markerPattern = /<!-- task-assignment:(pending|resolved|failed) claimant=([A-Za-z0-9-]+) -->/;
            const sameUser = (left, right) => left.toLowerCase() === right.toLowerCase();

            async function reply(body) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body
              });
            }

            const deadlinePattern = /<!--\s*task-deadline:(\d{4}-\d{2}-\d{2} \d{2}:\d{2})\s*-->/;
            const ddlPattern = /^(\d{4})-(\d{2})-(\d{2}) ((?:[01]\d|2[0-3]):[0-5]\d|24:00)$/;
            const beijingDate = value => {
              const parts = new Intl.DateTimeFormat('en-CA', {
                timeZone: 'Asia/Shanghai',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
              }).formatToParts(value);
              const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
              return `${values.year}-${values.month}-${values.day}`;
            };
            const validDeadline = value => {
              const match = (value || '').match(ddlPattern);
              if (!match) {
                return false;
              }
              const [, year, month, day, hm] = match;
              const maxDay = new Date(Date.UTC(Number(year), Number(month), 0)).getUTCDate();
              return Number(month) >= 1 && Number(month) <= 12 &&
                Number(day) >= 1 && Number(day) <= maxDay;
            };
            const addBusinessDays = (value, count) => {
              const match = value.match(ddlPattern);
              if (!match || !Number.isInteger(count) || count <= 0) {
                return null;
              }
              const [, year, month, day, hm] = match;
              const cursor = new Date(Date.UTC(Number(year), Number(month) - 1, Number(day), 12));
              let remaining = count;
              while (remaining > 0) {
                cursor.setUTCDate(cursor.getUTCDate() + 1);
                if (cursor.getUTCDay() !== 0 && cursor.getUTCDay() !== 6) {
                  remaining -= 1;
                }
              }
              const resultDate = [
                cursor.getUTCFullYear(),
                String(cursor.getUTCMonth() + 1).padStart(2, '0'),
                String(cursor.getUTCDate()).padStart(2, '0')
              ].join('-');
              return `${resultDate} ${hm}`;
            };
            const section = label => {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const match = (issue.body || '').match(
                new RegExp(`(?:^|\\n)### ${escaped}\\r?\\n([\\s\\S]*?)(?=\\r?\\n### |$)`)
              );
              return match?.[1].trim() || '';
            };
            const latestCommentDeadline = comments => {
              const ordered = [...comments].sort((left, right) =>
                (Date.parse(left.created_at) - Date.parse(right.created_at)) ||
                ((left.id || 0) - (right.id || 0))
              );
              for (const comment of ordered.reverse()) {
                if (comment.user?.login !== 'github-actions[bot]') {
                  continue;
                }
                const marker = (comment.body || '').match(deadlinePattern);
                if (marker && validDeadline(marker[1])) {
                  return marker[1];
                }
              }
              return null;
            };
            const currentDeadline = () => {
              const marked = latestCommentDeadline(comments);
              if (marked) {
                return marked;
              }
              const legacy = section('截止时间（DDL）');
              return validDeadline(legacy) ? legacy : null;
            };
            const deadlineComment = ddl => `<!-- task-deadline:${ddl} -->`;

            if (!/^\[TASK\]\s+\S/.test(issue.title)) {
              await reply('认领命令只适用于标题以 `[TASK]` 开头的任务 Issue。');
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100
            });
            const lastState = [...comments].reverse().find(comment =>
              comment.user?.login === 'github-actions[bot]' && markerPattern.test(comment.body || '')
            );
            const stateMatch = lastState?.body.match(markerPattern);
            const pendingClaimant = stateMatch?.[1] === 'pending' ? stateMatch[2] : null;
            const assignees = issue.assignees.map(assignee => assignee.login);

            if (command === '/assign') {
              if (argument) {
                await reply('认领命令不需要参数，请直接评论 `/assign`。');
                return;
              }
              if (assignees.length) {
                await reply(`该任务已由 ${assignees.map(login => `@${login}`).join('、')} 认领。`);
                return;
              }
              if (pendingClaimant) {
                await reply(`@${pendingClaimant} 的认领请求正在等待 Issue 发布者确认。`);
                return;
              }

              const marker = `<!-- task-assignment:pending claimant=${actor} -->`;
              await reply(`${marker}\n@${issue.user.login}，@${actor} 请求认领该任务。请回复 \`/confirm\` 确认；确认前每隔 2 小时会再次提醒。`);
              return;
            }

            if (!sameUser(actor, issue.user.login)) {
              await reply(`只有 Issue 发布者 @${issue.user.login} 可以使用 \`/confirm\` 确认认领。`);
              return;
            }
            if (argument) {
              await reply('确认认领不需要参数，请直接评论 `/confirm`；DDL 将按预估工作日自动生成。');
              return;
            }
            if (!pendingClaimant) {
              await reply('当前没有等待确认的认领请求。');
              return;
            }

            const resolvedMarker = `<!-- task-assignment:resolved claimant=${pendingClaimant} -->`;
            const failedMarker = `<!-- task-assignment:failed claimant=${pendingClaimant} -->`;
            if (assignees.length && !assignees.some(login => sameUser(login, pendingClaimant))) {
              await reply(`${failedMarker}\n认领未完成：该任务已经分配给 ${assignees.map(login => `@${login}`).join('、')}。`);
              return;
            }

              let ddl = currentDeadline();
              let deadlineNote = '';
              if (!ddl) {
                const estimate = Number(section('预估天数'));
                if (!Number.isFinite(estimate) || estimate <= 0) {
                  await reply(`${failedMarker}\n无法确认认领：“预估天数”必须是大于 0 的数字。请发布者先修正 Issue。`);
                  return;
                }
                const businessDays = Math.ceil(estimate);
                const today = beijingDate(new Date());
                ddl = addBusinessDays(`${today} 23:59`, businessDays);
                if (!ddl) {
                  await reply(`${failedMarker}\n无法根据“预估天数”生成 DDL，请检查日期配置后重试。`);
                  return;
                }
                deadlineNote =
                  `任务 DDL 已按预估 **${estimate} 天**设置为 **${ddl}**（北京时间 UTC+8）。` +
                  ` 生成规则：从确认日之后的第一个工作日开始，按周一至周五累计 ${businessDays} 个工作日，` +
                  `小数向上取整。`;
              } else {
                deadlineNote = `任务 DDL 为 **${ddl}**（北京时间 UTC+8）。`;
              }

            if (!assignees.some(login => sameUser(login, pendingClaimant))) {
              try {
                await github.rest.issues.addAssignees({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  assignees: [pendingClaimant]
                });
              } catch (error) {
                await reply(`${failedMarker}\n无法将 @${pendingClaimant} 设为 Assignee。请确认该成员具有仓库协作权限后重新评论 \`/assign\`。`);
                core.setFailed(error.message);
                return;
              }
            }

            const refreshed = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            const assigned = refreshed.data.assignees.some(assignee =>
              sameUser(assignee.login, pendingClaimant)
            );
            if (!assigned) {
              await reply(`${failedMarker}\n无法将 @${pendingClaimant} 设为 Assignee。请确认该成员具有仓库协作权限后重新评论 \`/assign\`。`);
              core.setFailed(`GitHub did not assign ${pendingClaimant}`);
              return;
            }

              await reply(
                `${resolvedMarker}\n${deadlineComment(ddl)}\n` +
                `认领已确认：@${pendingClaimant} 现为该任务的执行人。\n\n${deadlineNote}`
              );

  remind-publisher:
    name: Remind task publishers
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Remind pending confirmations
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const interval = 2 * 60 * 60 * 1000;
            const markerPattern = /<!-- task-assignment:(pending|resolved|failed) claimant=([A-Za-z0-9-]+) -->/;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            for (const issue of issues) {
              if (issue.pull_request || !/^\[TASK\]\s+\S/.test(issue.title) || issue.assignees.length) {
                continue;
              }

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issue.number,
                per_page: 100
              });
              const lastState = [...comments].reverse().find(comment =>
                comment.user?.login === 'github-actions[bot]' && markerPattern.test(comment.body || '')
              );
              const stateMatch = lastState?.body.match(markerPattern);
              if (!lastState || stateMatch?.[1] !== 'pending') {
                continue;
              }

              const elapsed = Date.now() - Date.parse(lastState.created_at);
              if (elapsed < interval) {
                continue;
              }

              const claimant = stateMatch[2];
              const marker = `<!-- task-assignment:pending claimant=${claimant} -->`;
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `${marker}\n@${issue.user.login}，@${claimant} 的认领请求仍在等待确认。请回复 \`/confirm\`。`
              });
            }
