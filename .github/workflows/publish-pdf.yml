name: Publish Complete PDF

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Synchronize generated chapter metadata
        run: |
          python3 scripts/update-manifest.py
          python3 scripts/update-modules.py

      - name: Compile complete book
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_xelatex: true

      - name: Verify PDF
        run: |
          test -s build/main.pdf
          du -h build/main.pdf

      - name: Upload downloadable PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: complete-book-pdf
          path: build/main.pdf
          if-no-files-found: error
          retention-days: 90

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage Pages site
        env:
          SITE_DIR: ${{ runner.temp }}/pdf-pages
          PDFJS_ARCHIVE: ${{ runner.temp }}/pdfjs-dist-3.11.174.tgz
          PDFJS_EXTRACT: ${{ runner.temp }}/pdfjs-dist
        run: |
          mkdir -p "$SITE_DIR"
          cp build/main.pdf "$SITE_DIR/main.pdf"
          cp .github/pages/index.html "$SITE_DIR/index.html"
          mkdir -p "$SITE_DIR/vendor/pdfjs"
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://registry.npmjs.org/pdfjs-dist/-/pdfjs-dist-3.11.174.tgz" \
            -o "$PDFJS_ARCHIVE"
          printf '%s  %s\n' \
            '11402926f38e7d5c71e63f4c3fdcfcb9172afd5bd202900994cecfa8ee7a98c4' \
            "$PDFJS_ARCHIVE" | sha256sum -c -
          mkdir -p "$PDFJS_EXTRACT"
          tar -xzf "$PDFJS_ARCHIVE" -C "$PDFJS_EXTRACT" \
            package/build/pdf.min.js \
            package/build/pdf.worker.min.js \
            package/cmaps \
            package/standard_fonts \
            package/LICENSE
          cp "$PDFJS_EXTRACT/package/build/pdf.min.js" "$SITE_DIR/vendor/pdfjs/"
          cp "$PDFJS_EXTRACT/package/build/pdf.worker.min.js" "$SITE_DIR/vendor/pdfjs/"
          cp -R "$PDFJS_EXTRACT/package/cmaps" "$SITE_DIR/vendor/pdfjs/"
          cp -R "$PDFJS_EXTRACT/package/standard_fonts" "$SITE_DIR/vendor/pdfjs/"
          cp "$PDFJS_EXTRACT/package/LICENSE" "$SITE_DIR/vendor/pdfjs/"
          test -s "$SITE_DIR/vendor/pdfjs/pdf.min.js"
          test -s "$SITE_DIR/vendor/pdfjs/pdf.worker.min.js"
          test -s "$SITE_DIR/vendor/pdfjs/cmaps/Adobe-GB1-UCS2.bcmap"
          test -s "$SITE_DIR/vendor/pdfjs/standard_fonts/LiberationSans-Regular.ttf"
          python3 scripts/build-site-info.py --output "$SITE_DIR/book-info.json"
          test -s "$SITE_DIR/book-info.json"
          touch "$SITE_DIR/.nojekyll"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pdf-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
