<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>从指令集到智能应用 · 最新完整版</title>
  <style>
    :root {
      color-scheme: light;
      --brand: #17324d;
      --accent: #2b6d85;
      --line: #d5dde5;
      --panel: #f4f7fa;
      --muted: #667085;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      color: var(--brand);
      background: var(--panel);
      font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 14px 22px;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 18px;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .download {
      flex: none;
      padding: 9px 15px;
      border-radius: 5px;
      color: #ffffff;
      background: var(--accent);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    main {
      flex: 1;
      min-height: 0;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }

    @media (max-width: 640px) {
      header {
        align-items: flex-start;
        padding: 12px 14px;
      }

      h1 {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>从指令集到智能应用 · 最新完整版</h1>
      <p>本页随 main 分支自动更新；完整历史构建可在 GitHub Actions 中下载。</p>
    </div>
    <a class="download" href="main.pdf" download>下载 PDF</a>
  </header>
  <main>
    <iframe src="main.pdf" title="教材完整 PDF 在线预览"></iframe>
  </main>
</body>
</html>
