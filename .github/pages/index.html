<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>从指令集到智能应用 · 最新完整版</title>
  <style>
    :root {
      color-scheme: light;
      --brand: #17324d;
      --accent: #2b6d85;
      --line: #d5dde5;
      --panel: #f4f7fa;
      --muted: #667085;
      --paper: #ffffff;
      --header-height: 67px;
      --info-height: 42px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--panel);
    }

    body {
      min-height: 100%;
      margin: 0;
      color: var(--brand);
      font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: var(--header-height);
      padding: 14px 22px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
    }

    h1 {
      margin: 0 0 4px;
      font-size: 18px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .book-info {
      position: sticky;
      top: var(--header-height);
      z-index: 24;
      height: auto;
      padding: 0 22px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      overflow: visible;
    }

    body.info-expanded {
      --info-height: 112px;
    }

    .info-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 42px;
    }

    .info-summary-text {
      display: flex;
      min-width: 0;
      align-items: baseline;
      gap: 10px;
    }

    .info-summary strong {
      flex: none;
      font-size: 13px;
    }

    #info-brief {
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .info-toggle {
      flex: none;
      min-width: 76px;
      padding: 5px 10px;
      font-size: 12px;
      background: var(--paper);
    }

    .info-details {
      padding-bottom: 6px;
    }

    .book-info.collapsed .info-details {
      display: none;
    }

    .meta-row {
      display: flex;
      gap: 10px;
      height: 47px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: thin;
    }

    .meta-item {
      flex: none;
      min-width: 118px;
      max-width: 190px;
      width: max-content;
      padding: 6px 11px;
      overflow: hidden;
      border: 1px solid rgb(213 221 229 / 90%);
      border-radius: 7px;
      background: var(--paper);
    }

    .meta-item strong {
      display: block;
      max-width: 100%;
      margin-bottom: 2px;
      overflow: hidden;
      color: var(--brand);
      font-size: 14px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .meta-item span {
      display: block;
      max-width: 100%;
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .download {
      flex: none;
      padding: 9px 15px;
      border-radius: 5px;
      color: var(--paper);
      background: var(--accent);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .toolbar {
      position: sticky;
      top: calc(var(--header-height) + var(--info-height));
      z-index: 23;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 52px;
      padding: 8px 14px 10px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
      backdrop-filter: blur(8px);
      transition: top 180ms ease;
    }

    .progress-track {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 3px;
      overflow: hidden;
      background: var(--line);
    }

    #reading-progress {
      display: block;
      width: 0;
      height: 100%;
      border-radius: 0 3px 3px 0;
      background: var(--accent);
      transition: width 180ms ease;
    }

    .info-links {
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 3px;
    }

    .chapter-overview,
    .contributor-overview {
      position: relative;
      color: var(--brand);
      font-size: 13px;
    }

    .chapter-overview summary,
    .contributor-overview summary {
      width: fit-content;
      color: var(--accent);
      cursor: pointer;
      font-weight: 700;
    }

    .chapter-list,
    .contributor-list {
      margin: 9px 0 0;
      padding: 0;
      list-style: none;
    }

    .chapter-overview[open] .chapter-list,
    .contributor-overview[open] .contributor-list {
      position: absolute;
      top: 24px;
      z-index: 48;
      width: min(760px, calc(100vw - 34px));
      max-height: calc(100vh - var(--header-height) - var(--info-height) - 72px);
      margin: 0;
      padding: 8px 16px 12px;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: 0 16px 36px rgb(23 50 77 / 18%);
    }

    .chapter-overview[open] .chapter-list {
      left: 0;
    }

    .contributor-overview[open] .contributor-list {
      left: -120px;
    }

    .chapter-list li {
      padding: 8px 0;
      border-top: 1px solid rgb(213 221 229 / 75%);
    }

    .chapter-line {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .chapter-line strong {
      font-size: 13px;
    }

    .chapter-line span {
      flex: 0 1 auto;
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .chapter-sections {
      margin: 4px 0 0;
      padding: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
      list-style: none;
    }

    .chapter-sections li {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      padding: 3px 0;
    }

    .section-name {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .section-metrics {
      flex: none;
      color: var(--accent);
      white-space: nowrap;
    }

    .contributor-list li {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 8px 0;
      border-top: 1px solid rgb(213 221 229 / 75%);
    }

    .contributor-list li:first-child {
      border-top: 0;
    }

    .contributor-list a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }

    .contributor-meta {
      flex: none;
      color: var(--muted);
      font-size: 11px;
      text-align: right;
    }

    .contributor-empty {
      padding: 10px 0;
      color: var(--muted);
    }

    button,
    input {
      font: inherit;
    }

    button {
      min-width: 76px;
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--brand);
      background: var(--paper);
    }

    button:disabled {
      cursor: default;
      opacity: 0.45;
    }

    .toc-toggle {
      min-width: 58px;
    }

    .page-control {
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    body.toc-open {
      overflow: hidden;
    }

    .toc-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      visibility: hidden;
      background: rgb(23 50 77 / 36%);
      opacity: 0;
      transition: opacity 180ms ease, visibility 180ms ease;
    }

    .toc-panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      width: min(390px, 90vw);
      background: var(--paper);
      box-shadow: -16px 0 40px rgb(23 50 77 / 20%);
      transform: translateX(100%);
      transition: transform 180ms ease;
    }

    .toc-open .toc-backdrop {
      visibility: visible;
      opacity: 1;
    }

    .toc-open .toc-panel {
      transform: translateX(0);
    }

    .toc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    .toc-header strong {
      font-size: 16px;
    }

    .toc-close {
      min-width: auto;
      padding: 6px 11px;
    }

    .toc-content {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px 28px;
    }

    .toc-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .toc-list .toc-list {
      margin-left: 14px;
      padding-left: 8px;
      border-left: 1px solid var(--line);
    }

    .toc-item-button {
      display: block;
      width: 100%;
      padding: 8px 9px;
      border: 0;
      border-radius: 5px;
      color: var(--brand);
      font-size: 13px;
      line-height: 1.45;
      text-align: left;
      background: transparent;
    }

    .toc-item-button:hover,
    .toc-item-button:focus-visible {
      background: var(--panel);
    }

    .toc-item-button.active {
      color: var(--accent);
      font-weight: 700;
      background: var(--panel);
      box-shadow: inset 3px 0 var(--accent);
    }

    .toc-placeholder {
      margin: 24px 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .zoom-controls {
      display: none;
      align-items: center;
      gap: 4px;
      margin-left: 4px;
      padding-left: 10px;
      border-left: 1px solid var(--line);
    }

    .zoom-controls button {
      min-width: 38px;
      padding-right: 8px;
      padding-left: 8px;
    }

    #zoom-reset {
      min-width: 58px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
    }

    #page-number {
      width: 52px;
      margin: 0 4px;
      padding: 6px 4px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--brand);
      text-align: center;
      background: var(--paper);
    }

    main {
      padding: 16px 12px 28px;
      overflow-x: auto;
    }

    .status {
      padding: 52px 16px;
      color: var(--muted);
      text-align: center;
    }

    .pdf-pages {
      width: 100%;
      margin: 0 auto;
    }

    .pdf-page {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      aspect-ratio: 210 / 297;
      margin: 0 0 14px;
      overflow: hidden;
      background: var(--paper);
      box-shadow: 0 10px 32px rgb(23 50 77 / 16%);
    }

    .pdf-page canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: var(--paper);
    }

    .pdf-page-number {
      color: var(--muted);
      font-size: 13px;
    }

    .fallback {
      max-width: 560px;
      margin: 48px auto;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      line-height: 1.7;
      text-align: center;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 640px) {
      :root {
        --header-height: 52px;
        --info-height: 42px;
      }

      body.info-expanded {
        --info-height: 96px;
      }

      header {
        align-items: flex-start;
        padding: 12px 14px;
      }

      h1 {
        font-size: 16px;
      }

      .subtitle {
        display: none;
      }

      .download {
        padding: 8px 11px;
        font-size: 13px;
      }

      .book-info {
        padding: 0 8px;
      }

      .info-summary {
        gap: 8px;
      }

      .info-summary-text {
        gap: 7px;
      }

      #info-brief {
        font-size: 11px;
      }

      .info-toggle {
        min-width: 68px;
        padding-right: 8px;
        padding-left: 8px;
      }

      .meta-row {
        gap: 7px;
        height: 43px;
      }

      .meta-item {
        min-width: 104px;
        padding: 5px 9px;
      }

      .toolbar {
        gap: 7px;
        padding: 7px 8px 9px;
      }

      button {
        min-width: 68px;
        padding: 8px 10px;
      }

      .page-control {
        font-size: 13px;
      }

      .chapter-line {
        align-items: flex-start;
        flex-direction: column;
        gap: 3px;
      }

      .chapter-sections li {
        gap: 8px;
      }

      main {
        padding: 8px 6px 20px;
      }

      .pdf-page {
        margin-bottom: 8px;
      }
    }

    @media (min-width: 1024px) {
      :root {
        --toc-width: min(380px, 34vw);
      }

      body.toc-open {
        overflow: auto;
        padding-right: var(--toc-width);
      }

      .toc-open .toc-backdrop {
        visibility: hidden;
        opacity: 0;
      }

      .toc-panel {
        top: var(--header-height);
        width: var(--toc-width);
        border-left: 1px solid var(--line);
        background: var(--panel);
        box-shadow: none;
      }

      .toc-header {
        background: var(--paper);
      }

      .zoom-controls {
        display: flex;
      }
    }

    @media (max-width: 380px) {
      .toolbar {
        gap: 4px;
        padding-right: 5px;
        padding-left: 5px;
      }

      button {
        min-width: 58px;
        padding-right: 7px;
        padding-left: 7px;
      }

      .toc-toggle {
        min-width: 52px;
      }

      .page-control {
        font-size: 12px;
      }

      #page-number {
        width: 42px;
        margin-right: 2px;
        margin-left: 2px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>从指令集到智能应用 · 最新完整版</h1>
      <p class="subtitle">本页随 main 分支自动更新；完整历史构建可在 GitHub Actions 中下载。</p>
    </div>
    <a class="download" href="main.pdf" download>下载 PDF</a>
  </header>

  <section id="book-info" class="book-info collapsed" aria-label="本书数据">
    <div class="info-summary">
      <div class="info-summary-text">
        <strong>书籍概况</strong>
        <span id="info-brief">正在统计书籍信息…</span>
      </div>
      <button id="info-toggle" class="info-toggle" type="button"
              aria-controls="book-info-details" aria-expanded="false">展开数据</button>
    </div>
    <div id="book-info-details" class="info-details">
      <div class="meta-row">
      <div class="meta-item">
        <strong id="meta-updated">–</strong>
        <span>最近更新</span>
      </div>
      <div class="meta-item">
        <strong id="meta-commit">–</strong>
        <span>提交版本</span>
      </div>
      <div class="meta-item">
        <strong id="meta-structure">–</strong>
        <span>章节结构</span>
      </div>
      <div class="meta-item">
        <strong id="meta-words">–</strong>
        <span>字数估算</span>
      </div>
      <div class="meta-item">
        <strong id="meta-images">–</strong>
        <span>图片数量</span>
      </div>
      <div class="meta-item">
        <strong id="meta-pages">–</strong>
        <span>PDF 页数</span>
      </div>
      <div class="meta-item">
        <strong id="meta-size">–</strong>
        <span>文件大小</span>
      </div>
      <div class="meta-item">
        <strong id="meta-duration">–</strong>
        <span>写作持续</span>
      </div>
      <div class="meta-item">
        <strong id="meta-collaborators">–</strong>
        <span>协作人员</span>
      </div>
      </div>
      <div class="info-links">
        <details class="chapter-overview">
          <summary>展开章节概览</summary>
          <ol id="chapter-list" class="chapter-list"></ol>
        </details>
        <details class="contributor-overview">
          <summary>协作人员（<span id="collaborator-count">–</span> 人）</summary>
          <ul id="collaborator-list" class="contributor-list"></ul>
        </details>
      </div>
    </div>
  </section>

  <nav class="toolbar" aria-label="PDF 页面导航">
    <button id="previous-page" type="button" disabled>上一页</button>
    <label class="page-control">
      第 <input id="page-number" type="number" min="1" value="1" aria-label="当前页码" disabled>
      / <span id="page-count">–</span> 页
    </label>
    <button id="next-page" type="button" disabled>下一页</button>
    <button id="toc-toggle" class="toc-toggle" type="button"
            aria-controls="toc-panel" aria-expanded="false" disabled>目录</button>
    <div class="zoom-controls" aria-label="PDF 缩放">
      <button id="zoom-out" type="button" aria-label="缩小">−</button>
      <button id="zoom-reset" type="button" title="恢复适合宽度">100%</button>
      <button id="zoom-in" type="button" aria-label="放大">＋</button>
    </div>
    <div id="progress-track" class="progress-track" role="progressbar"
         aria-label="阅读进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <span id="reading-progress"></span>
    </div>
  </nav>

  <div id="toc-backdrop" class="toc-backdrop"></div>
  <aside id="toc-panel" class="toc-panel" aria-label="PDF 目录" aria-hidden="true">
    <div class="toc-header">
      <strong>目录</strong>
      <button id="toc-close" class="toc-close" type="button">关闭</button>
    </div>
    <nav class="toc-content">
      <p id="toc-placeholder" class="toc-placeholder">PDF 加载完成后可跳转章节。</p>
      <div id="toc-list"></div>
    </nav>
  </aside>

  <main>
    <div id="status" class="status" role="status">正在加载 PDF…</div>
    <div id="pdf-pages" class="pdf-pages" aria-label="教材 PDF 连续页面"></div>
    <div id="fallback" class="fallback" hidden>
      <p>当前浏览器未能加载内嵌预览。</p>
      <a class="download" href="main.pdf">打开或下载完整 PDF</a>
    </div>
  </main>

  <noscript>
    <div class="fallback">需要启用 JavaScript 才能在线预览。<a href="main.pdf">直接打开 PDF</a></div>
  </noscript>

  <script src="vendor/pdfjs/pdf.min.js"></script>
  <script>
    (() => {
      const pagesContainer = document.getElementById('pdf-pages');
      const status = document.getElementById('status');
      const fallback = document.getElementById('fallback');
      const previousButton = document.getElementById('previous-page');
      const nextButton = document.getElementById('next-page');
      const pageNumber = document.getElementById('page-number');
      const pageCount = document.getElementById('page-count');
      const bookInfo = document.getElementById('book-info');
      const infoToggle = document.getElementById('info-toggle');
      const infoBrief = document.getElementById('info-brief');
      const chapterList = document.getElementById('chapter-list');
      const chapterOverview = document.querySelector('.chapter-overview');
      const collaboratorList = document.getElementById('collaborator-list');
      const collaboratorCount = document.getElementById('collaborator-count');
      const contributorOverview = document.querySelector('.contributor-overview');
      const readingProgress = document.getElementById('reading-progress');
      const progressTrack = document.getElementById('progress-track');
      const tocToggle = document.getElementById('toc-toggle');
      const tocClose = document.getElementById('toc-close');
      const tocBackdrop = document.getElementById('toc-backdrop');
      const tocList = document.getElementById('toc-list');
      const tocPlaceholder = document.getElementById('toc-placeholder');
      const zoomOut = document.getElementById('zoom-out');
      const zoomReset = document.getElementById('zoom-reset');
      const zoomIn = document.getElementById('zoom-in');

      let pdfDocument = null;
      let currentPage = 1;
      let resizeTimer = null;
      let currentPageFrame = null;
      let renderObserver = null;
      let releaseObserver = null;
      let zoomFactor = 1;
      let wheelZoomTimer = null;
      const pageStates = new Map();
      const MAX_RENDERED_PAGES = 4;
      const MAX_CANVAS_PIXELS = 8000000;

      const formatWordCount = value => {
        if (!Number.isFinite(value)) {
          return '–';
        }
        if (value >= 10000) {
          return `${(value / 10000).toFixed(1)} 万字`;
        }
        return `${value.toLocaleString('zh-CN')} 字`;
      };

      const formatFileSize = bytes => {
        if (!Number.isFinite(bytes)) {
          return '–';
        }
        return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
      };

      const renderBookInfo = info => {
        document.getElementById('meta-updated').textContent = info.updated_at || '–';
        document.getElementById('meta-commit').textContent = info.commit || '–';
        document.getElementById('meta-structure').textContent =
          `${info.chapter_count || 0} 章 · ${info.section_count || 0} 节`;
        document.getElementById('meta-words').textContent = formatWordCount(info.word_count);
        document.getElementById('meta-images').textContent =
          `${(info.image_count || 0).toLocaleString('zh-CN')} 张`;
        document.getElementById('meta-pages').textContent =
          Number.isFinite(info.page_count) ? `${info.page_count} 页` : '–';
        document.getElementById('meta-size').textContent = formatFileSize(info.pdf_bytes);
        document.getElementById('meta-duration').textContent =
          Number.isFinite(info.development_days) ? `${info.development_days} 天` : '–';
        document.getElementById('meta-collaborators').textContent =
          `${info.collaborator_count || 0} 人`;
        collaboratorCount.textContent = String(info.collaborator_count || 0);
        infoBrief.textContent =
          `${info.development_days || 0} 天 · ` +
          `${info.collaborator_count || 0} 人协作 · ` +
          `${info.chapter_count || 0} 章 · ${info.section_count || 0} 节 · ` +
          `${Number.isFinite(info.page_count) ? info.page_count : 0} 页 · ` +
          `${(info.image_count || 0).toLocaleString('zh-CN')} 图`;

        chapterList.textContent = '';
        for (const chapter of info.chapters || []) {
          const item = document.createElement('li');
          const line = document.createElement('div');
          line.className = 'chapter-line';

          const title = document.createElement('strong');
          const number = chapter.number === null || chapter.number === undefined
            ? ''
            : `第 ${chapter.number} 章 · `;
          title.textContent = number + (chapter.title || '未命名章节');

          const count = document.createElement('span');
          count.textContent =
            `${chapter.section_count || 0} 节 · ` +
            `${(chapter.word_count || 0).toLocaleString('zh-CN')} 字 · ` +
            `${chapter.image_count || 0} 图`;
          line.append(title, count);

          const sections = document.createElement('ul');
          sections.className = 'chapter-sections';
          if (!(chapter.sections || []).length) {
            const empty = document.createElement('li');
            empty.textContent = '暂无小节';
            sections.append(empty);
          } else {
            for (const section of chapter.sections) {
              const sectionItem = document.createElement('li');
              const name = document.createElement('span');
              name.className = 'section-name';
              name.textContent = section.title || '未命名小节';
              const metrics = document.createElement('span');
              metrics.className = 'section-metrics';
              metrics.textContent =
                `${(section.word_count || 0).toLocaleString('zh-CN')} 字 · ` +
                `${section.image_count || 0} 图`;
              sectionItem.append(name, metrics);
              sections.append(sectionItem);
            }
          }
          item.append(line, sections);
          chapterList.append(item);
        }

        collaboratorList.textContent = '';
        if (!(info.collaborators || []).length) {
          const empty = document.createElement('li');
          empty.className = 'contributor-empty';
          empty.textContent = '暂无可公开的协作人员记录。';
          collaboratorList.append(empty);
        } else {
          for (const person of info.collaborators) {
            const item = document.createElement('li');
            const link = document.createElement('a');
            link.href = `https://github.com/${encodeURIComponent(person.login)}`;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = `@${person.login}`;

            const roles = [];
            if (person.commits) roles.push(`提交 ${person.commits}`);
            if (person.tasks_published) roles.push(`发布 ${person.tasks_published}`);
            if (person.tasks_claimed) roles.push(`任务 ${person.tasks_claimed}`);
            if (person.task_comments) roles.push(`评论 ${person.task_comments}`);
            if (person.review_comments) roles.push(`LGTM ${person.review_comments}`);

            const meta = document.createElement('span');
            meta.className = 'contributor-meta';
            meta.textContent = roles.join(' · ') || '参与协作';
            item.append(link, meta);
            collaboratorList.append(item);
          }
        }

        bookInfo.hidden = false;
      };

      const loadBookInfo = async () => {
        try {
          const source = new URL('book-info.json', window.location.href);
          source.searchParams.set('v', Date.now().toString(36));
          const response = await fetch(source.href);
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          renderBookInfo(await response.json());
        } catch (error) {
          console.warn('书籍信息加载失败', error);
        }
      };

      const openToc = () => {
        if (!pdfDocument) {
          return;
        }
        document.body.classList.add('toc-open');
        tocToggle.setAttribute('aria-expanded', 'true');
        document.getElementById('toc-panel').setAttribute('aria-hidden', 'false');
        tocClose.focus();
        schedulePageRefresh();
      };

      const closeToc = () => {
        document.body.classList.remove('toc-open');
        tocToggle.setAttribute('aria-expanded', 'false');
        document.getElementById('toc-panel').setAttribute('aria-hidden', 'true');
        schedulePageRefresh();
      };

      const setActiveTocItem = button => {
        for (const active of tocList.querySelectorAll('.toc-item-button.active')) {
          active.classList.remove('active');
        }
        button?.classList.add('active');
      };

      const goToDestination = async (destinationValue, button) => {
        try {
          const destination = typeof destinationValue === 'string'
            ? await pdfDocument.getDestination(destinationValue)
            : destinationValue;
          if (!Array.isArray(destination) || !destination.length) {
            return;
          }
          const pageReference = destination[0];
          const pageIndex = Number.isInteger(pageReference)
            ? pageReference
            : await pdfDocument.getPageIndex(pageReference);
          setActiveTocItem(button);
          scrollToPage(pageIndex + 1, 'auto');
        } catch (error) {
          console.warn('目录跳转失败', error);
        }
      };

      const appendOutline = (items, container) => {
        const list = document.createElement('ol');
        list.className = 'toc-list';
        for (const item of items) {
          const entry = document.createElement('li');
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'toc-item-button';
          button.textContent = item.title || '未命名目录项';
          if (item.dest) {
            button.addEventListener('click', () => goToDestination(item.dest, button));
          } else {
            button.disabled = true;
          }
          entry.append(button);
          if (item.items && item.items.length) {
            appendOutline(item.items, entry);
          }
          list.append(entry);
        }
        container.append(list);
      };

      const loadOutline = async () => {
        try {
          const outline = await pdfDocument.getOutline();
          tocList.textContent = '';
          if (outline && outline.length) {
            tocPlaceholder.hidden = true;
            appendOutline(outline, tocList);
            tocToggle.disabled = false;
          } else {
            tocPlaceholder.textContent = '当前 PDF 中没有可用的章节书签。';
          }
        } catch (error) {
          console.warn('PDF 目录加载失败', error);
          tocPlaceholder.textContent = 'PDF 目录加载失败，可使用页码跳转。';
        }
      };

      const showFallback = message => {
        status.hidden = true;
        fallback.hidden = false;
        if (message) {
          fallback.querySelector('p').textContent = message;
        }
      };

      const updateNavigation = () => {
        const ready = Boolean(pdfDocument);
        previousButton.disabled = !ready || currentPage <= 1;
        nextButton.disabled = !ready || currentPage >= pdfDocument.numPages;
        pageNumber.disabled = !ready;
        pageNumber.value = String(currentPage);
        zoomOut.disabled = !ready || zoomFactor <= 0.75;
        zoomIn.disabled = !ready || zoomFactor >= 2.5;
        zoomReset.disabled = !ready;
        zoomReset.textContent = `${Math.round(zoomFactor * 100)}%`;
        const progress = ready ? Math.round(currentPage / pdfDocument.numPages * 100) : 0;
        readingProgress.style.width = `${progress}%`;
        progressTrack.setAttribute('aria-valuenow', String(progress));
      };

      const createPageElements = () => {
        pagesContainer.textContent = '';
        pageStates.clear();
        const fragment = document.createDocumentFragment();
        for (let number = 1; number <= pdfDocument.numPages; number++) {
          const container = document.createElement('section');
          container.className = 'pdf-page';
          container.dataset.page = String(number);
          container.setAttribute('aria-label', `第 ${number} 页`);

          const label = document.createElement('span');
          label.className = 'pdf-page-number';
          label.textContent = `第 ${number} 页`;
          container.append(label);

          pageStates.set(number, {
            container,
            label,
            canvas: null,
            task: null,
            page: null,
            generation: 0,
            rendering: false
          });
          fragment.append(container);
        }
        pagesContainer.append(fragment);
      };

      const releasePage = number => {
        const state = pageStates.get(number);
        if (!state) {
          return;
        }
        state.generation += 1;
        if (state.task) {
          state.task.cancel();
          state.task = null;
        }
        if (state.canvas) {
          state.canvas.remove();
          state.canvas = null;
        }
        if (state.page) {
          state.page.cleanup();
          state.page = null;
        }
        state.rendering = false;
        state.label.hidden = false;
      };

      const ensurePageRendered = async number => {
        const state = pageStates.get(number);
        if (!pdfDocument || !state || state.rendering || state.canvas) {
          return;
        }

        const renderedPages = [...pageStates.entries()]
          .filter(([, value]) => value.canvas || value.rendering)
          .sort((left, right) => Math.abs(right[0] - currentPage) - Math.abs(left[0] - currentPage));
        while (renderedPages.length >= MAX_RENDERED_PAGES) {
          const [farthestPage] = renderedPages.shift();
          releasePage(farthestPage);
        }

        state.rendering = true;
        const generation = state.generation + 1;
        state.generation = generation;
        let page = null;
        let canvas = null;

        try {
          page = await pdfDocument.getPage(number);
          if (state.generation !== generation || !state.container.isConnected) {
            page.cleanup();
            return;
          }

          const availableWidth = Math.max(240, state.container.clientWidth);
          const baseViewport = page.getViewport({ scale: 1 });
          const viewport = page.getViewport({ scale: availableWidth / baseViewport.width });
          const desiredScale = Math.min(window.devicePixelRatio || 1, 3);
          const pixelLimitScale = Math.sqrt(
            MAX_CANVAS_PIXELS / (viewport.width * viewport.height)
          );
          const outputScale = Math.min(desiredScale, pixelLimitScale);
          canvas = document.createElement('canvas');
          canvas.width = Math.floor(viewport.width * outputScale);
          canvas.height = Math.floor(viewport.height * outputScale);
          const context = canvas.getContext('2d', { alpha: false });
          context.imageSmoothingEnabled = true;
          context.imageSmoothingQuality = 'high';
          const transform = outputScale === 1
            ? null
            : [outputScale, 0, 0, outputScale, 0, 0];

          state.label.hidden = true;
          state.canvas = canvas;
          state.page = page;
          state.container.prepend(canvas);
          const task = page.render({
            canvasContext: context,
            viewport,
            transform
          });
          state.task = task;
          await task.promise;

          if (state.generation !== generation ||
              state.task !== task ||
              !state.container.isConnected) {
            canvas.remove();
            if (state.canvas === canvas) {
              state.canvas = null;
            }
            if (state.page === page) {
              page.cleanup();
              state.page = null;
            }
            return;
          }
          state.task = null;
          if (number === 1) {
            status.hidden = true;
          }
        } catch (error) {
          if (error?.name !== 'RenderingCancelledException') {
            console.error(`第 ${number} 页渲染失败`, error);
          }
          if (state.canvas === canvas) {
            state.canvas.remove();
            state.canvas = null;
          }
          if (state.page === page) {
            state.page.cleanup();
            state.page = null;
          }
          if (state.generation === generation) {
            state.label.hidden = false;
          }
        } finally {
          if (state.generation === generation) {
            state.rendering = false;
          }
        }
      };

      const installPageObservers = () => {
        renderObserver?.disconnect();
        releaseObserver?.disconnect();

        if ('IntersectionObserver' in window) {
          renderObserver = new IntersectionObserver(entries => {
            for (const entry of entries) {
              if (entry.isIntersecting) {
                ensurePageRendered(Number(entry.target.dataset.page));
              }
            }
          }, { rootMargin: '800px 0px' });

          releaseObserver = new IntersectionObserver(entries => {
            for (const entry of entries) {
              if (!entry.isIntersecting) {
                releasePage(Number(entry.target.dataset.page));
              }
            }
          }, { rootMargin: '1600px 0px' });

          for (const state of pageStates.values()) {
            renderObserver.observe(state.container);
            releaseObserver.observe(state.container);
          }
        } else {
          [1, 2, 3].forEach(ensurePageRendered);
        }
      };

      const updateCurrentPageFromScroll = () => {
        if (!pdfDocument || pageStates.size === 0) {
          return;
        }
        const toolbarBottom = document.querySelector('.toolbar').getBoundingClientRect().bottom;
        const anchor = toolbarBottom + Math.max(80, (window.innerHeight - toolbarBottom) * 0.28);
        let closestPage = currentPage;
        let closestDistance = Number.POSITIVE_INFINITY;

        for (const [number, state] of pageStates) {
          const rect = state.container.getBoundingClientRect();
          if (rect.top <= anchor && rect.bottom >= anchor) {
            closestPage = number;
            break;
          }
          const distance = Math.abs(rect.top - anchor);
          if (distance < closestDistance) {
            closestDistance = distance;
            closestPage = number;
          }
        }

        if (closestPage !== currentPage) {
          currentPage = closestPage;
          updateNavigation();
        }
        ensurePageRendered(Math.min(pdfDocument.numPages, currentPage + 1));
      };

      const scrollToPage = (number, behavior = 'smooth') => {
        if (!pdfDocument) {
          return;
        }
        const target = Math.min(Math.max(number, 1), pdfDocument.numPages);
        const state = pageStates.get(target);
        if (!state) {
          return;
        }
        const offset = document.querySelector('.toolbar').getBoundingClientRect().bottom + 8;
        const top = window.scrollY + state.container.getBoundingClientRect().top - offset;
        currentPage = target;
        updateNavigation();
        ensurePageRendered(target);
        window.scrollTo({ top: Math.max(0, top), behavior });
      };

      const applyPageWidth = () => {
        const main = document.querySelector('main');
        const horizontalPadding = window.innerWidth <= 640 ? 12 : 28;
        const fitWidth = Math.max(240, Math.min(main.clientWidth - horizontalPadding, 1080));
        pagesContainer.style.width = `${Math.floor(fitWidth * zoomFactor)}px`;
        zoomReset.textContent = `${Math.round(zoomFactor * 100)}%`;
      };

      const refreshRenderedPages = () => {
        if (!pdfDocument) {
          applyPageWidth();
          return;
        }
        const target = currentPage;
        for (const number of pageStates.keys()) {
          releasePage(number);
        }
        applyPageWidth();
        requestAnimationFrame(() => {
          scrollToPage(target, 'auto');
          ensurePageRendered(target);
        });
      };

      const schedulePageRefresh = () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(refreshRenderedPages, 100);
      };

      const syncInfoHeight = () => {
        const height = Math.ceil(bookInfo.getBoundingClientRect().height);
        if (height > 0) {
          document.documentElement.style.setProperty('--info-height', `${height}px`);
        }
      };

      const setInfoCollapsed = (collapsed, persist = true) => {
        bookInfo.classList.toggle('collapsed', collapsed);
        document.body.classList.toggle('info-expanded', !collapsed);
        infoToggle.textContent = collapsed ? '展开数据' : '收起数据';
        infoToggle.setAttribute('aria-expanded', String(!collapsed));
        if (collapsed) {
          chapterOverview.open = false;
          contributorOverview.open = false;
        }
        if (persist) {
          try {
            localStorage.setItem('book-info-expanded', String(!collapsed));
          } catch (error) {
            console.warn('无法保存数据栏展开状态', error);
          }
        }
        requestAnimationFrame(() => {
          syncInfoHeight();
          schedulePageRefresh();
        });
      };

      const setZoom = factor => {
        zoomFactor = Math.min(2.5, Math.max(0.75, factor));
        schedulePageRefresh();
        updateNavigation();
      };

      const loadPdf = async () => {
        if (!window.pdfjsLib) {
          showFallback('PDF 预览组件加载失败，请尝试直接打开或下载。');
          return;
        }

        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdfjs/pdf.worker.min.js';
        const source = new URL('main.pdf', window.location.href);
        source.searchParams.set('v', Date.now().toString(36));

        try {
          pdfDocument = await window.pdfjsLib.getDocument({
            url: source.href,
            isEvalSupported: false,
            cMapUrl: new URL('vendor/pdfjs/cmaps/', window.location.href).href,
            cMapPacked: true,
            standardFontDataUrl: new URL(
              'vendor/pdfjs/standard_fonts/',
              window.location.href
            ).href,
            useSystemFonts: true
          }).promise;
          pageCount.textContent = String(pdfDocument.numPages);
          pageNumber.max = String(pdfDocument.numPages);
          applyPageWidth();
          createPageElements();
          installPageObservers();
          updateNavigation();
          await ensurePageRendered(1);
          updateCurrentPageFromScroll();
          await loadOutline();
        } catch (error) {
          console.error(error);
          showFallback('PDF 加载失败，请检查网络后重试，或直接打开下载。');
        }
      };

      previousButton.addEventListener('click', () => {
        scrollToPage(currentPage - 1);
      });

      nextButton.addEventListener('click', () => {
        scrollToPage(currentPage + 1);
      });

      pageNumber.addEventListener('change', () => {
        const requested = Number.parseInt(pageNumber.value, 10);
        if (Number.isFinite(requested)) {
          scrollToPage(Math.min(Math.max(requested, 1), pdfDocument?.numPages || 1), 'auto');
        } else {
          updateNavigation();
        }
      });

      tocToggle.addEventListener('click', () => {
        if (document.body.classList.contains('toc-open')) {
          closeToc();
        } else {
          openToc();
        }
      });
      tocClose.addEventListener('click', () => {
        closeToc();
        tocToggle.focus();
      });
      tocBackdrop.addEventListener('click', closeToc);
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && document.body.classList.contains('toc-open')) {
          closeToc();
          tocToggle.focus();
        }
      });

      const zoomSteps = [0.75, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2, 2.25, 2.5];
      const stepZoom = direction => {
        const next = direction > 0
          ? zoomSteps.find(value => value > zoomFactor + 0.001)
          : [...zoomSteps].reverse().find(value => value < zoomFactor - 0.001);
        if (next !== undefined) {
          setZoom(next);
        }
      };

      zoomOut.addEventListener('click', () => stepZoom(-1));
      zoomIn.addEventListener('click', () => stepZoom(1));
      zoomReset.addEventListener('click', () => setZoom(1));
      infoToggle.addEventListener('click', () => {
        setInfoCollapsed(!bookInfo.classList.contains('collapsed'));
      });
      chapterOverview.addEventListener('toggle', () => {
        if (chapterOverview.open) {
          contributorOverview.open = false;
        }
      });
      contributorOverview.addEventListener('toggle', () => {
        if (contributorOverview.open) {
          chapterOverview.open = false;
        }
      });

      window.addEventListener('wheel', event => {
        if (!(event.ctrlKey || event.metaKey) || window.innerWidth < 1024) {
          return;
        }
        event.preventDefault();
        const direction = event.deltaY < 0 ? 1 : -1;
        clearTimeout(wheelZoomTimer);
        wheelZoomTimer = setTimeout(() => stepZoom(direction), 50);
      }, { passive: false });

      document.addEventListener('keydown', event => {
        if (!(event.ctrlKey || event.metaKey)) {
          return;
        }
        if (event.key === '+' || event.key === '=') {
          event.preventDefault();
          stepZoom(1);
        } else if (event.key === '-') {
          event.preventDefault();
          stepZoom(-1);
        } else if (event.key === '0') {
          event.preventDefault();
          setZoom(1);
        }
      });

      window.addEventListener('resize', schedulePageRefresh);

      if ('ResizeObserver' in window) {
        let observedMainWidth = Math.round(document.querySelector('main').clientWidth);
        new ResizeObserver(entries => {
          const width = Math.round(entries[0].contentRect.width);
          if (width !== observedMainWidth) {
            observedMainWidth = width;
            schedulePageRefresh();
          }
        }).observe(document.querySelector('main'));
        new ResizeObserver(syncInfoHeight).observe(bookInfo);
      }

      window.addEventListener('scroll', () => {
        if (currentPageFrame !== null) {
          return;
        }
        currentPageFrame = requestAnimationFrame(() => {
          currentPageFrame = null;
          updateCurrentPageFromScroll();
        });
      }, { passive: true });

      let expandBookInfo = false;
      try {
        expandBookInfo = localStorage.getItem('book-info-expanded') === 'true';
      } catch (error) {
        console.warn('无法读取数据栏展开状态', error);
      }
      setInfoCollapsed(!expandBookInfo, false);

      loadBookInfo();
      loadPdf();
    })();
  </script>
</body>
</html>
