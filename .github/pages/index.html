<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>从指令集到智能应用 · 最新完整版</title>
  <style>
    :root {
      color-scheme: light;
      --brand: #17324d;
      --accent: #2b6d85;
      --line: #d5dde5;
      --panel: #f4f7fa;
      --muted: #667085;
      --paper: #ffffff;
      --header-height: 67px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--panel);
    }

    body {
      min-height: 100%;
      margin: 0;
      color: var(--brand);
      font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: var(--header-height);
      padding: 14px 22px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
    }

    h1 {
      margin: 0 0 4px;
      font-size: 18px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .book-info {
      padding: 11px 22px 9px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(120deg, rgb(244 247 250 / 96%), rgb(232 241 246 / 88%));
    }

    .meta-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 3px;
      scrollbar-width: thin;
    }

    .meta-item {
      flex: none;
      min-width: 118px;
      padding: 8px 12px;
      border: 1px solid rgb(213 221 229 / 90%);
      border-radius: 7px;
      background: rgb(255 255 255 / 82%);
    }

    .meta-item strong {
      display: block;
      margin-bottom: 2px;
      color: var(--brand);
      font-size: 15px;
    }

    .meta-item span {
      color: var(--muted);
      font-size: 11px;
    }

    .download {
      flex: none;
      padding: 9px 15px;
      border-radius: 5px;
      color: var(--paper);
      background: var(--accent);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .toolbar {
      position: sticky;
      top: var(--header-height);
      z-index: 25;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 52px;
      padding: 8px 14px 10px;
      border-bottom: 1px solid var(--line);
      background: rgb(255 255 255 / 94%);
      backdrop-filter: blur(8px);
    }

    .progress-track {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 3px;
      overflow: hidden;
      background: var(--line);
    }

    #reading-progress {
      display: block;
      width: 0;
      height: 100%;
      border-radius: 0 3px 3px 0;
      background: var(--accent);
      transition: width 180ms ease;
    }

    .chapter-overview {
      margin-top: 8px;
      color: var(--brand);
      font-size: 13px;
    }

    .chapter-overview summary {
      width: fit-content;
      color: var(--accent);
      cursor: pointer;
      font-weight: 700;
    }

    .chapter-list {
      margin: 9px 0 0;
      padding: 0;
      list-style: none;
    }

    .chapter-list li {
      padding: 8px 0;
      border-top: 1px solid rgb(213 221 229 / 75%);
    }

    .chapter-line {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .chapter-line strong {
      font-size: 13px;
    }

    .chapter-line span {
      flex: none;
      color: var(--muted);
      font-size: 12px;
    }

    .chapter-sections {
      margin: 4px 0 0;
      padding: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
      list-style: none;
    }

    .chapter-sections li {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      padding: 3px 0;
    }

    .section-name {
      min-width: 0;
    }

    .section-metrics {
      flex: none;
      color: var(--accent);
      white-space: nowrap;
    }

    button,
    input {
      font: inherit;
    }

    button {
      min-width: 76px;
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--brand);
      background: var(--paper);
    }

    button:disabled {
      cursor: default;
      opacity: 0.45;
    }

    .toc-toggle {
      min-width: 58px;
    }

    .page-control {
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    body.toc-open {
      overflow: hidden;
    }

    .toc-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      visibility: hidden;
      background: rgb(23 50 77 / 36%);
      opacity: 0;
      transition: opacity 180ms ease, visibility 180ms ease;
    }

    .toc-panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      width: min(390px, 90vw);
      background: var(--paper);
      box-shadow: -16px 0 40px rgb(23 50 77 / 20%);
      transform: translateX(100%);
      transition: transform 180ms ease;
    }

    .toc-open .toc-backdrop {
      visibility: visible;
      opacity: 1;
    }

    .toc-open .toc-panel {
      transform: translateX(0);
    }

    .toc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    .toc-header strong {
      font-size: 16px;
    }

    .toc-close {
      min-width: auto;
      padding: 6px 11px;
    }

    .toc-content {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px 28px;
    }

    .toc-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .toc-list .toc-list {
      margin-left: 14px;
      padding-left: 8px;
      border-left: 1px solid var(--line);
    }

    .toc-item-button {
      display: block;
      width: 100%;
      padding: 8px 9px;
      border: 0;
      border-radius: 5px;
      color: var(--brand);
      font-size: 13px;
      line-height: 1.45;
      text-align: left;
      background: transparent;
    }

    .toc-item-button:hover,
    .toc-item-button:focus-visible {
      background: var(--panel);
    }

    .toc-placeholder {
      margin: 24px 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    #page-number {
      width: 52px;
      margin: 0 4px;
      padding: 6px 4px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--brand);
      text-align: center;
      background: var(--paper);
    }

    main {
      padding: 16px 12px 28px;
    }

    .status {
      padding: 52px 16px;
      color: var(--muted);
      text-align: center;
    }

    .pdf-pages {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
    }

    .pdf-page {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      aspect-ratio: 210 / 297;
      margin: 0 0 14px;
      overflow: hidden;
      background: var(--paper);
      box-shadow: 0 10px 32px rgb(23 50 77 / 16%);
    }

    .pdf-page canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: var(--paper);
    }

    .pdf-page-number {
      color: var(--muted);
      font-size: 13px;
    }

    .fallback {
      max-width: 560px;
      margin: 48px auto;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      line-height: 1.7;
      text-align: center;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 640px) {
      :root {
        --header-height: 52px;
      }

      header {
        align-items: flex-start;
        padding: 12px 14px;
      }

      h1 {
        font-size: 16px;
      }

      .subtitle {
        display: none;
      }

      .download {
        padding: 8px 11px;
        font-size: 13px;
      }

      .book-info {
        padding: 8px 8px 7px;
      }

      .meta-row {
        gap: 7px;
      }

      .meta-item {
        min-width: 104px;
        padding: 7px 10px;
      }

      .toolbar {
        gap: 7px;
        padding: 7px 8px 9px;
      }

      button {
        min-width: 68px;
        padding: 8px 10px;
      }

      .page-control {
        font-size: 13px;
      }

      .chapter-line {
        align-items: flex-start;
        flex-direction: column;
        gap: 3px;
      }

      .chapter-sections li {
        gap: 8px;
      }

      main {
        padding: 8px 6px 20px;
      }

      .pdf-page {
        margin-bottom: 8px;
      }
    }

    @media (max-width: 380px) {
      .toolbar {
        gap: 4px;
        padding-right: 5px;
        padding-left: 5px;
      }

      button {
        min-width: 58px;
        padding-right: 7px;
        padding-left: 7px;
      }

      .toc-toggle {
        min-width: 52px;
      }

      .page-control {
        font-size: 12px;
      }

      #page-number {
        width: 42px;
        margin-right: 2px;
        margin-left: 2px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>从指令集到智能应用 · 最新完整版</h1>
      <p class="subtitle">本页随 main 分支自动更新；完整历史构建可在 GitHub Actions 中下载。</p>
    </div>
    <a class="download" href="main.pdf" download>下载 PDF</a>
  </header>

  <section id="book-info" class="book-info" aria-label="本书数据" hidden>
    <div class="meta-row">
      <div class="meta-item">
        <strong id="meta-updated">–</strong>
        <span>最近更新</span>
      </div>
      <div class="meta-item">
        <strong id="meta-commit">–</strong>
        <span>提交版本</span>
      </div>
      <div class="meta-item">
        <strong id="meta-structure">–</strong>
        <span>章节结构</span>
      </div>
      <div class="meta-item">
        <strong id="meta-words">–</strong>
        <span>字数估算</span>
      </div>
      <div class="meta-item">
        <strong id="meta-images">–</strong>
        <span>图片数量</span>
      </div>
      <div class="meta-item">
        <strong id="meta-pages">–</strong>
        <span>PDF 页数</span>
      </div>
      <div class="meta-item">
        <strong id="meta-size">–</strong>
        <span>文件大小</span>
      </div>
    </div>
    <details class="chapter-overview">
      <summary>展开章节概览</summary>
      <ol id="chapter-list" class="chapter-list"></ol>
    </details>
  </section>

  <nav class="toolbar" aria-label="PDF 页面导航">
    <button id="previous-page" type="button" disabled>上一页</button>
    <label class="page-control">
      第 <input id="page-number" type="number" min="1" value="1" aria-label="当前页码" disabled>
      / <span id="page-count">–</span> 页
    </label>
    <button id="next-page" type="button" disabled>下一页</button>
    <button id="toc-toggle" class="toc-toggle" type="button"
            aria-controls="toc-panel" aria-expanded="false" disabled>目录</button>
    <div id="progress-track" class="progress-track" role="progressbar"
         aria-label="阅读进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <span id="reading-progress"></span>
    </div>
  </nav>

  <div id="toc-backdrop" class="toc-backdrop"></div>
  <aside id="toc-panel" class="toc-panel" aria-label="PDF 目录" aria-hidden="true">
    <div class="toc-header">
      <strong>目录</strong>
      <button id="toc-close" class="toc-close" type="button">关闭</button>
    </div>
    <nav class="toc-content">
      <p id="toc-placeholder" class="toc-placeholder">PDF 加载完成后可跳转章节。</p>
      <div id="toc-list"></div>
    </nav>
  </aside>

  <main>
    <div id="status" class="status" role="status">正在加载 PDF…</div>
    <div id="pdf-pages" class="pdf-pages" aria-label="教材 PDF 连续页面"></div>
    <div id="fallback" class="fallback" hidden>
      <p>当前浏览器未能加载内嵌预览。</p>
      <a class="download" href="main.pdf">打开或下载完整 PDF</a>
    </div>
  </main>

  <noscript>
    <div class="fallback">需要启用 JavaScript 才能在线预览。<a href="main.pdf">直接打开 PDF</a></div>
  </noscript>

  <script src="vendor/pdfjs/pdf.min.js"></script>
  <script>
    (() => {
      const pagesContainer = document.getElementById('pdf-pages');
      const status = document.getElementById('status');
      const fallback = document.getElementById('fallback');
      const previousButton = document.getElementById('previous-page');
      const nextButton = document.getElementById('next-page');
      const pageNumber = document.getElementById('page-number');
      const pageCount = document.getElementById('page-count');
      const bookInfo = document.getElementById('book-info');
      const chapterList = document.getElementById('chapter-list');
      const readingProgress = document.getElementById('reading-progress');
      const progressTrack = document.getElementById('progress-track');
      const tocToggle = document.getElementById('toc-toggle');
      const tocClose = document.getElementById('toc-close');
      const tocBackdrop = document.getElementById('toc-backdrop');
      const tocList = document.getElementById('toc-list');
      const tocPlaceholder = document.getElementById('toc-placeholder');

      let pdfDocument = null;
      let currentPage = 1;
      let resizeTimer = null;
      let currentPageFrame = null;
      let renderObserver = null;
      let releaseObserver = null;
      const pageStates = new Map();

      const formatWordCount = value => {
        if (!Number.isFinite(value)) {
          return '–';
        }
        if (value >= 10000) {
          return `${(value / 10000).toFixed(1)} 万字`;
        }
        return `${value.toLocaleString('zh-CN')} 字`;
      };

      const formatFileSize = bytes => {
        if (!Number.isFinite(bytes)) {
          return '–';
        }
        return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
      };

      const renderBookInfo = info => {
        document.getElementById('meta-updated').textContent = info.updated_at || '–';
        document.getElementById('meta-commit').textContent = info.commit || '–';
        document.getElementById('meta-structure').textContent =
          `${info.chapter_count || 0} 章 · ${info.section_count || 0} 节`;
        document.getElementById('meta-words').textContent = formatWordCount(info.word_count);
        document.getElementById('meta-images').textContent =
          `${(info.image_count || 0).toLocaleString('zh-CN')} 张`;
        document.getElementById('meta-pages').textContent =
          Number.isFinite(info.page_count) ? `${info.page_count} 页` : '–';
        document.getElementById('meta-size').textContent = formatFileSize(info.pdf_bytes);

        chapterList.textContent = '';
        for (const chapter of info.chapters || []) {
          const item = document.createElement('li');
          const line = document.createElement('div');
          line.className = 'chapter-line';

          const title = document.createElement('strong');
          const number = chapter.number === null || chapter.number === undefined
            ? ''
            : `第 ${chapter.number} 章 · `;
          title.textContent = number + (chapter.title || '未命名章节');

          const count = document.createElement('span');
          count.textContent =
            `${chapter.section_count || 0} 节 · ` +
            `${(chapter.word_count || 0).toLocaleString('zh-CN')} 字 · ` +
            `${chapter.image_count || 0} 图`;
          line.append(title, count);

          const sections = document.createElement('ul');
          sections.className = 'chapter-sections';
          if (!(chapter.sections || []).length) {
            const empty = document.createElement('li');
            empty.textContent = '暂无小节';
            sections.append(empty);
          } else {
            for (const section of chapter.sections) {
              const sectionItem = document.createElement('li');
              const name = document.createElement('span');
              name.className = 'section-name';
              name.textContent = section.title || '未命名小节';
              const metrics = document.createElement('span');
              metrics.className = 'section-metrics';
              metrics.textContent =
                `${(section.word_count || 0).toLocaleString('zh-CN')} 字 · ` +
                `${section.image_count || 0} 图`;
              sectionItem.append(name, metrics);
              sections.append(sectionItem);
            }
          }
          item.append(line, sections);
          chapterList.append(item);
        }

        bookInfo.hidden = false;
      };

      const loadBookInfo = async () => {
        try {
          const source = new URL('book-info.json', window.location.href);
          source.searchParams.set('v', Date.now().toString(36));
          const response = await fetch(source.href);
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          renderBookInfo(await response.json());
        } catch (error) {
          console.warn('书籍信息加载失败', error);
        }
      };

      const openToc = () => {
        if (!pdfDocument) {
          return;
        }
        document.body.classList.add('toc-open');
        tocToggle.setAttribute('aria-expanded', 'true');
        document.getElementById('toc-panel').setAttribute('aria-hidden', 'false');
        tocClose.focus();
      };

      const closeToc = () => {
        document.body.classList.remove('toc-open');
        tocToggle.setAttribute('aria-expanded', 'false');
        document.getElementById('toc-panel').setAttribute('aria-hidden', 'true');
      };

      const goToDestination = async destinationValue => {
        try {
          const destination = typeof destinationValue === 'string'
            ? await pdfDocument.getDestination(destinationValue)
            : destinationValue;
          if (!Array.isArray(destination) || !destination.length) {
            return;
          }
          const pageReference = destination[0];
          const pageIndex = Number.isInteger(pageReference)
            ? pageReference
            : await pdfDocument.getPageIndex(pageReference);
          scrollToPage(pageIndex + 1, 'auto');
          closeToc();
          tocToggle.focus();
        } catch (error) {
          console.warn('目录跳转失败', error);
        }
      };

      const appendOutline = (items, container) => {
        const list = document.createElement('ol');
        list.className = 'toc-list';
        for (const item of items) {
          const entry = document.createElement('li');
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'toc-item-button';
          button.textContent = item.title || '未命名目录项';
          if (item.dest) {
            button.addEventListener('click', () => goToDestination(item.dest));
          } else {
            button.disabled = true;
          }
          entry.append(button);
          if (item.items && item.items.length) {
            appendOutline(item.items, entry);
          }
          list.append(entry);
        }
        container.append(list);
      };

      const loadOutline = async () => {
        try {
          const outline = await pdfDocument.getOutline();
          tocList.textContent = '';
          if (outline && outline.length) {
            tocPlaceholder.hidden = true;
            appendOutline(outline, tocList);
            tocToggle.disabled = false;
          } else {
            tocPlaceholder.textContent = '当前 PDF 中没有可用的章节书签。';
          }
        } catch (error) {
          console.warn('PDF 目录加载失败', error);
          tocPlaceholder.textContent = 'PDF 目录加载失败，可使用页码跳转。';
        }
      };

      const showFallback = message => {
        status.hidden = true;
        fallback.hidden = false;
        if (message) {
          fallback.querySelector('p').textContent = message;
        }
      };

      const updateNavigation = () => {
        const ready = Boolean(pdfDocument);
        previousButton.disabled = !ready || currentPage <= 1;
        nextButton.disabled = !ready || currentPage >= pdfDocument.numPages;
        pageNumber.disabled = !ready;
        pageNumber.value = String(currentPage);
        const progress = ready ? Math.round(currentPage / pdfDocument.numPages * 100) : 0;
        readingProgress.style.width = `${progress}%`;
        progressTrack.setAttribute('aria-valuenow', String(progress));
      };

      const createPageElements = () => {
        pagesContainer.textContent = '';
        pageStates.clear();
        const fragment = document.createDocumentFragment();
        for (let number = 1; number <= pdfDocument.numPages; number++) {
          const container = document.createElement('section');
          container.className = 'pdf-page';
          container.dataset.page = String(number);
          container.setAttribute('aria-label', `第 ${number} 页`);

          const label = document.createElement('span');
          label.className = 'pdf-page-number';
          label.textContent = `第 ${number} 页`;
          container.append(label);

          pageStates.set(number, {
            container,
            label,
            canvas: null,
            task: null,
            rendering: false
          });
          fragment.append(container);
        }
        pagesContainer.append(fragment);
      };

      const releasePage = number => {
        const state = pageStates.get(number);
        if (!state) {
          return;
        }
        if (state.task) {
          state.task.cancel();
          state.task = null;
        }
        if (state.canvas) {
          state.canvas.remove();
          state.canvas = null;
        }
        state.rendering = false;
        state.label.hidden = false;
      };

      const ensurePageRendered = async number => {
        const state = pageStates.get(number);
        if (!pdfDocument || !state || state.rendering || state.canvas) {
          return;
        }
        state.rendering = true;

        try {
          const page = await pdfDocument.getPage(number);
          if (!state.container.isConnected) {
            return;
          }

          const availableWidth = Math.max(240, state.container.clientWidth);
          const baseViewport = page.getViewport({ scale: 1 });
          const viewport = page.getViewport({ scale: availableWidth / baseViewport.width });
          const outputScale = Math.min(window.devicePixelRatio || 1, 1.5);
          const canvas = document.createElement('canvas');
          canvas.width = Math.floor(viewport.width * outputScale);
          canvas.height = Math.floor(viewport.height * outputScale);
          const context = canvas.getContext('2d', { alpha: false });
          const transform = outputScale === 1
            ? null
            : [outputScale, 0, 0, outputScale, 0, 0];

          state.label.hidden = true;
          state.canvas = canvas;
          state.container.prepend(canvas);
          const task = page.render({
            canvasContext: context,
            viewport,
            transform
          });
          state.task = task;
          await task.promise;

          if (state.task !== task || !state.container.isConnected) {
            canvas.remove();
            if (state.canvas === canvas) {
              state.canvas = null;
            }
            return;
          }
          state.task = null;
          if (number === 1) {
            status.hidden = true;
          }
        } catch (error) {
          if (error?.name !== 'RenderingCancelledException') {
            console.error(`第 ${number} 页渲染失败`, error);
          }
          if (state.canvas?.isConnected) {
            state.canvas.remove();
          }
          state.canvas = null;
          state.label.hidden = false;
        } finally {
          state.rendering = false;
        }
      };

      const installPageObservers = () => {
        renderObserver?.disconnect();
        releaseObserver?.disconnect();

        if ('IntersectionObserver' in window) {
          renderObserver = new IntersectionObserver(entries => {
            for (const entry of entries) {
              if (entry.isIntersecting) {
                ensurePageRendered(Number(entry.target.dataset.page));
              }
            }
          }, { rootMargin: '1200px 0px' });

          releaseObserver = new IntersectionObserver(entries => {
            for (const entry of entries) {
              if (!entry.isIntersecting) {
                releasePage(Number(entry.target.dataset.page));
              }
            }
          }, { rootMargin: '2600px 0px' });

          for (const state of pageStates.values()) {
            renderObserver.observe(state.container);
            releaseObserver.observe(state.container);
          }
        } else {
          [1, 2, 3].forEach(ensurePageRendered);
        }
      };

      const updateCurrentPageFromScroll = () => {
        if (!pdfDocument || pageStates.size === 0) {
          return;
        }
        const header = document.querySelector('header').offsetHeight;
        const toolbar = document.querySelector('.toolbar').offsetHeight;
        const anchor = header + toolbar + Math.max(80, window.innerHeight * 0.28);
        let closestPage = currentPage;
        let closestDistance = Number.POSITIVE_INFINITY;

        for (const [number, state] of pageStates) {
          const rect = state.container.getBoundingClientRect();
          if (rect.top <= anchor && rect.bottom >= anchor) {
            closestPage = number;
            break;
          }
          const distance = Math.abs(rect.top - anchor);
          if (distance < closestDistance) {
            closestDistance = distance;
            closestPage = number;
          }
        }

        if (closestPage !== currentPage) {
          currentPage = closestPage;
          updateNavigation();
        }
        ensurePageRendered(Math.min(pdfDocument.numPages, currentPage + 1));
      };

      const scrollToPage = (number, behavior = 'smooth') => {
        if (!pdfDocument) {
          return;
        }
        const target = Math.min(Math.max(number, 1), pdfDocument.numPages);
        const state = pageStates.get(target);
        if (!state) {
          return;
        }
        const offset = document.querySelector('header').offsetHeight +
          document.querySelector('.toolbar').offsetHeight + 8;
        const top = window.scrollY + state.container.getBoundingClientRect().top - offset;
        currentPage = target;
        updateNavigation();
        ensurePageRendered(target);
        window.scrollTo({ top: Math.max(0, top), behavior });
      };

      const loadPdf = async () => {
        if (!window.pdfjsLib) {
          showFallback('PDF 预览组件加载失败，请尝试直接打开或下载。');
          return;
        }

        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdfjs/pdf.worker.min.js';
        const source = new URL('main.pdf', window.location.href);
        source.searchParams.set('v', Date.now().toString(36));

        try {
          pdfDocument = await window.pdfjsLib.getDocument({
            url: source.href,
            isEvalSupported: false,
            cMapUrl: new URL('vendor/pdfjs/cmaps/', window.location.href).href,
            cMapPacked: true,
            standardFontDataUrl: new URL(
              'vendor/pdfjs/standard_fonts/',
              window.location.href
            ).href,
            useSystemFonts: true
          }).promise;
          pageCount.textContent = String(pdfDocument.numPages);
          pageNumber.max = String(pdfDocument.numPages);
          createPageElements();
          installPageObservers();
          updateNavigation();
          await ensurePageRendered(1);
          updateCurrentPageFromScroll();
          await loadOutline();
        } catch (error) {
          console.error(error);
          showFallback('PDF 加载失败，请检查网络后重试，或直接打开下载。');
        }
      };

      previousButton.addEventListener('click', () => {
        scrollToPage(currentPage - 1);
      });

      nextButton.addEventListener('click', () => {
        scrollToPage(currentPage + 1);
      });

      pageNumber.addEventListener('change', () => {
        const requested = Number.parseInt(pageNumber.value, 10);
        if (Number.isFinite(requested)) {
          scrollToPage(Math.min(Math.max(requested, 1), pdfDocument?.numPages || 1), 'auto');
        } else {
          updateNavigation();
        }
      });

      tocToggle.addEventListener('click', openToc);
      tocClose.addEventListener('click', () => {
        closeToc();
        tocToggle.focus();
      });
      tocBackdrop.addEventListener('click', closeToc);
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && document.body.classList.contains('toc-open')) {
          closeToc();
          tocToggle.focus();
        }
      });

      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          for (const number of pageStates.keys()) {
            releasePage(number);
          }
          ensurePageRendered(currentPage);
          ensurePageRendered(Math.min(pdfDocument?.numPages || 1, currentPage + 1));
          updateCurrentPageFromScroll();
        }, 180);
      });

      window.addEventListener('scroll', () => {
        if (currentPageFrame !== null) {
          return;
        }
        currentPageFrame = requestAnimationFrame(() => {
          currentPageFrame = null;
          updateCurrentPageFromScroll();
        });
      }, { passive: true });

      loadBookInfo();
      loadPdf();
    })();
  </script>
</body>
</html>
