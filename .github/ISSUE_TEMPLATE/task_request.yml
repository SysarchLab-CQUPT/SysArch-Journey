name: 📋 任务发布
description: 发布一个可以被认领、逐步完成并接受复核的任务
title: "[TASK] "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        ## 使用说明

        用这个模板发布一个目标明确、可以被认领并接受复核的任务。
        任务不设截止时间（DDL），也不发送催交提醒。
        预估天数仅用于衡量任务量，并作为任务完成积分的工作量依据，不代表完成期限或进度要求。
        请静下心来，在学习、理解和实验的过程中逐步编写，把内容质量放在首位，不必过分追求进度。

        流程：执行人评论 `/assign` 认领 → 发布者回复 `/confirm` 确认 →
        完成后执行人评论 `/complete` 发起复核 → 3 位不同成员分别评论 `LGTM`
        后自动关闭。复核意见可在 `LGTM` 后附具体修改建议。

  - type: dropdown
    id: module
    attributes:
      label: 所属模块
      description: 选择这项工作对应的章节或支撑方向。
      options:
        - 第0章 排版示例：一本书里能写出什么
        - 第1章 计算机系统全貌与学习路线
        - 第2章 数字逻辑与硬件描述语言
        - 第3章 指令集架构与汇编编程
        - 第4章 处理器微架构：从单周期到流水线
        - 第5章 处理器微架构优化
        - 第6章 玩转 CPU 与 SoC
        - 第7章 操作系统：原理、移植与优化
        - 第8章 面向机器学习的加速器设计
        - 第9章 TinyML 与嵌入式智能应用部署
        - 配套代码与实验环境
        - 排版、图表与校对
        - 其他（请在补充信息中说明）
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 任务背景与目标
      description: 说明为什么需要这项工作、预期结果，以及它和整本书的关系。
      placeholder: 描述任务背景、目标和范围。
    validations:
      required: true

  - type: textarea
    id: deliverables
    attributes:
      label: 交付清单
      description: 每项交付物写成可勾选的子项，验收时逐条核对。
      placeholder: |
        - [ ] 交付项 1
        - [ ] 交付项 2
    validations:
      required: true

  - type: dropdown
    id: difficulty
    attributes:
      label: 任务难度
      description: 按任务复杂度和风险选择。
      options:
        - 低
        - 中
        - 高
    validations:
      required: true

  - type: input
    id: estimated_days
    attributes:
      label: 预估天数
      description: 以天为单位估计任务量，填大于 0 的数字，可用小数；仅用于衡量任务量和计算任务完成积分，不代表完成期限或进度要求。
      placeholder: "3"
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 说明怎样算完成：跑通什么、达到什么指标、由谁确认。可留空。
      placeholder: |
        1. ...
        2. ...

  - type: textarea
    id: notes
    attributes:
      label: 补充信息
      description: 依赖、参考资料、需要的硬件或软件环境；没有可留空。
